server.modules = (
    "mod_access",
    "mod_alias",
    "mod_cgi",
    "mod_rewrite",
    "mod_setenv"
)

server.document-root = "/srv/werc/sites/arthurgusmao.com.br"

server.bind = "0.0.0.0"
server.port = 8080
server.name = "arthurgusmao.com.br"

server.errorlog = "/dev/stderr"


server.error-handler-404 = "/werc.rc"

alias.url = (
    "/werc.rc" => "/srv/werc/bin/werc.rc",
    "/pub/"    => "/srv/werc/pub/"
)

cgi.assign = (
    ".rc" => ""
)

setenv.set-environment = (
    "PLAN9" => "/usr/lib/plan9",
    "PATH"  => "/usr/lib/plan9/bin:/usr/local/bin:/usr/bin:/bin"
)

# Never serve internal configuration directly.
$HTTP["url"] =~ "(^|/)(_werc|\\.git)(/|$)" {
    url.access-deny = ("")
}

# Send virtual pages and directories to werc.
# Existing static files remain served directly.
# Exclude private paths, public assets and the CGI itself.
$HTTP["url"] !~ "^/pub/|^/werc\\.rc$|(^|/)(_werc|\\.git)(/|$)" {
    url.rewrite-if-not-file = (
        "" => "/werc.rc"
    )
}
