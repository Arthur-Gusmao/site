name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PODMAN_COMPOSE_PROVIDER: /tmp/site-compose/bin/podman-compose
      PORT: "18083"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false

      - name: Prepare Podman Compose
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y podman nftables python3-venv
          python3 -m venv /tmp/site-compose
          /tmp/site-compose/bin/pip install podman-compose==1.6.0
          test "$(podman info --format '{{.Host.Security.Rootless}}')" = true

      - name: Validate configuration
        run: |
          sh -n check
          podman compose --profile tunnel config --services

      - name: Build and check site
        run: |
          set -eu
          trap 'podman compose logs; podman compose down' EXIT
          podman compose up -d --build
          ./check http://127.0.0.1:18083
